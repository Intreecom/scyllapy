[project]
name = "scyllapy-tmp"
description = "Async scylla driver for python"
readme = "README.md"
requires-python = ">=3.11,<4"
license-files = ["LICENSE"]
keywords = ["async-driver", "cassandra", "scylla", "scylla-driver"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Database :: Front-Ends",
  "Typing :: Typed",
]
dependencies = ["python-dateutil"]
dynamic = ["version"]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "scyllapy._internal"
python-source = "python"

[tool.mypy]
strict = true
mypy_path = "python"
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_calls = false
pretty = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = false
warn_unused_ignores = false

[tool.pytest]
anyio_mode = "auto"

[tool.ruff]
target-version = "py311"
exclude = [".venv/"]
line-length = 88

[tool.ruff.lint]
mccabe = { max-complexity = 10 }
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
select = [
  "E",  # Error
  "F",  # Pyflakes
  "W",  # Pycodestyle
  "C90",  # McCabe complexity
  "I",  # Isort
  "N",  # pep8-naming
  "D",  # Pydocstyle
  "ANN",  # Pytype annotations
  "S",  # Bandit
  "B",  # Bugbear
  "COM",  # Commas
  "C4",  # Comprehensions
  "ISC",  # Implicit string concat
  "PIE",  # Unnecessary code
  "T20",  # Catch prints
  "PYI",  # validate pyi files
  "Q",  # Checks for quotes
  "RSE",  # Checks raise statements
  "RET",  # Checks return statements
  "SLF",  # Self checks
  "SIM",  # Simplificator
  "PTH",  # Pathlib checks
  "ERA",  # Checks for commented out code
  "PL",  # PyLint checks
  "RUF",  # Specific to Ruff checks
  "UP",  # Pyupgrade
]
ignore = [
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in __init__
  "D212",  # Multi-line docstring summary should start at the first line
  "D401",  # First line should be in imperative mood
  "D104",  # Missing docstring in public package
  "D100",  # Missing docstring in public module
  "ANN401",  # typing.Any are disallowed in `**kwargs
  "PLR0913",  # Too many arguments for function call
  "D106",  # Missing docstring in public nested class
  "PYI021",  # Docstrings should not be included in stubs
  "COM812",  # Missing trailing comma in a list or tuple
]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = [
  "S101",  # Use of assert detected
  "S301",  # Use of pickle detected
  "D103",  # Missing docstring in public function
  "SLF001",  # Private member accessed
  "S311",  # Standard pseudo-random generators are not suitable for security/cryptographic purposes
  "D101",  # Missing docstring in public class
  "PLR2004",  # Magic value used in comparison
  "B017",  # Do not assert blind exception
  "S608",  # Possible SQL injection
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float"]

[tool.uv]
package = false
