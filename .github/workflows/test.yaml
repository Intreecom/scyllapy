name: 'Testing package'

on:
  pull_request:

jobs:
  py-lint:
    strategy:
      matrix:
        cmd:
          - ruff-check
          - ruff-format
          - mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run lint check
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: -a ${{ matrix.cmd }}
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
      with:
        toolchain: stable
        components: rustfmt
        override: true
    - name: Check code format
      run: cargo fmt -- --check --config use_try_shorthand=true,imports_granularity=Crate

  clippy:
    permissions:
      checks: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
      with:
        toolchain: stable
        components: clippy
        override: true
    - uses: actions-rs/clippy-check@9d09632661e31982c0be8af59aeb96b680641bc4 # v1.0.7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
  pytest:
    name: ${{matrix.job.os}}-${{matrix.py_version}}
    services:
      scylla:
        image: scylladb/scylla:5.2
        options: >-
          --health-cmd="cqlsh -e 'select * from system.local' "
          --health-interval=5s
          --health-timeout=5s
          --health-retries=60
        ports:
          - 9042:9042
    strategy:
      matrix:
        py_version: ["3.11", "3.12", "3.13", "3.14"]
        job:
            - os: ubuntu-latest
              ssl_cmd: sudo apt-get update && sudo apt-get install libssl-dev openssl
            # Uncomment when containerss become available
            # on these systems.
            # - os: windows-latest
            #   ssl_cmd: vcpkg install openssl:x64-windows-static-md
            # - os: macos-latest
            #   ssl_cmd: echo "Already installed"
    runs-on: ${{matrix.job.os}}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
      with:
        toolchain: stable
        components: clippy
        override: true
    - name: Setup OpenSSL
      run: ${{matrix.job.ssl_cmd}}
    - name: Setup python for test ${{ matrix.py_version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.py_version }}
    - name: Install tox
      run: pip install "tox-gh>=1.2,<2"
    - name: Run pytest
      run: tox -v

