[tox]
isolated_build = true
env_list =
    py314
    py313
    py312
    py311

[gh]
python =
    3.12 = py312
    3.11 = py311

[testenv]
skip_install = true
deps =
    pytest>=7,<8
    anyio>=3,<4
    maturin>=1,<2
    pytest-xdist>=3,<4
allowlist_externals = maturin
commands_pre =
    maturin develop
commands =
    pytest -vv -n auto
