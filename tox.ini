[tox]
isolated_build = true
env_list =
    py314
    py313
    py312
    py311

[gh]
python =
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314

[testenv]
skip_install = true
deps =
    pytest>=9,<10
    anyio>=4,<5
    maturin>=1,<2
    pytest-xdist>=3,<4
allowlist_externals = maturin
commands_pre =
    maturin develop
commands =
    pytest -vv -n auto
