[package]
name = "scyllapy"
version = "0.0.0"
edition = "2021"

[lib]
name = "scyllapy"
crate-type = ["cdylib"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.45"
eq-float = "0.1.0"
futures = "0.3.34"
log = "0.4.34"
openssl = { version = "0.10.81", features = ["vendored"] }
pyo3 = { version = "0.29.3", features = [
    "auto-initialize",
    "abi3-py311",
    "extension-module",
    "chrono",
] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pyo3-log = "0.13.4"
rustc-hash = "1.1.0"
scylla = { version = "0.12.0", features = ["ssl", "full-serialization"] }
bigdecimal-04 = { package = "bigdecimal", version = "0.4.11" }
thiserror = "1.0.69"
tokio = { version = "1.53.3", features = ["bytes"] }
uuid = { version = "1.28.0", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
panic = "abort"
